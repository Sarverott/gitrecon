name: tests

on:
  push:
    branches: [developement, revision, testing, releasing, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-default-groups --group test
      - run: uv run --no-sync pytest

name: BOS Loop Step

# Opens the PR from a branch to its next stage, as defined in .github/bos.config.json,
# and starts its checks. Started by pushes, or dispatched by the previous loop step.

on:
  push:
    branches:
      - development
      - revision
      - testing
      - releasing
      - rejection
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose next loop step should be opened
        required: true
        type: string

permissions:
  contents: write  # the AUTHORS refresh on releasing commits and pushes; everything else only reads
  pull-requests: write
  actions: write

concurrency:
  group: bos-flow-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  next-pr:
    name: Open PR to next stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0  # the whole history: AUTHORS is read from it

      # the middle of a release: testing was merged into releasing, the PR to master is not open yet
      - name: Set up uv
        if: (inputs.branch || github.ref_name) == 'releasing'
        uses: astral-sh/setup-uv@v10.2.0  # no moving major tags since v8

      - name: Refresh AUTHORS
        if: (inputs.branch || github.ref_name) == 'releasing'
        run: scripts/delegated/workflow-gh/release/authors.sh releasing

      - name: Open PR and start its checks
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: python3 .github/bos/flow.py next-pr "$BRANCH"

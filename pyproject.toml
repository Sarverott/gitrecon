[project]
name = "gitrecon"
version = "0.3.1"
description = "Exploring, mapping and labeling GitHub activity of users, organizations, repositories and projects"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Sett Sarverott A.A.B.", email = "sett@sarverott.com"},
]
dependencies = [
    "beautifulsoup4>=4.14.3",
    "chromadb>=1.5.5",
    "defusedxml>=0.7.1",
    "docker>=7.1.0",
    "langchain>=1.4.3",
    "lark>=1.3.1",
    "litellm>=1.82.6",
    "markdownify>=1.2.3",
    "marko>=2.2.2",
    "nanobot>=0.4.1",
    "networkx>=3.7",
    "ollama>=0.6.1",
    "openai>=2.29.0",
    "paramiko>=5.0.0",
    "podman>=5.7.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "rich>=13.9.4",
    "scapy>=2.8.0",
]
keywords = ["github", "recon", "osint", "gist", "data-mining"]

[project.optional-dependencies]
# the map dataset on Hugging Face: gitrecon atlas pull|push
hub = ["huggingface-hub>=1.7.2"]

[project.scripts]
gitrecon = "gitrecon.main:main"

[project.urls]
Homepage = "https://github.com/Sarverott/gitrecon"
Repository = "https://github.com/Sarverott/gitrecon"
Issues = "https://github.com/Sarverott/gitrecon/issues"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
test = ["pytest>=9.1.1"]
delivery = [
    "actionlint-py>=1.7.12.25",
    "commitizen>=4.19.0",
    "go-task-bin>=3.53.1",
    "shellcheck-py>=0.11.0.1",
    "tomlkit>=0.15.1",
]
dev = [
    { include-group = "test" },
    { include-group = "delivery" },
    # not used by gitrecon itself (yet): kept for notebooks and experiments
    "darkpoint>=0.2.0",
    "gitpython>=3.1.46",
    "pygithub>=2.8.1",
    "toml>=0.10.2",
    "chromadb>=1.5.5",
    "datasets>=4.8.3",
    "docker>=7.1.0",
    "huggingface-hub>=1.7.2",
    "ipywidgets>=8.1.8",
    "litellm[proxy]>=1.82.6",
    "marimo>=0.21.1",
    "ngrok>=1.7.0",
    "notebook>=7.5.5",
    "ollama>=0.6.1",
    "openai>=2.29.0",
    "podman>=5.7.0",
    "safetensors>=0.7.0",
    "tokenizers>=0.22.2",
    "tox>=4.64.7",
    "transformers>=5.3.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_files = ['metadata.json:"version"', "src/gitrecon/__init__.py:__version__"]
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
pre_bump_hooks = ["task sync"]

[project]
name = "gitrecon"
version = "0.1.0"
description = "Exploring, mapping and labeling GitHub activity of users, organizations, repositories and projects"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Sett Sarverott", email = "sarverott@gmail.com" }]
dependencies = [
    "beautifulsoup4>=4.14.3",
    "darkpoint>=0.2.0",
    "gitpython>=3.1.46",
    "lark>=1.3.1",
    "marko>=2.2.2",
    "pygithub>=2.8.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "toml>=0.10.2",
]

[project.scripts]
gitrecon = "gitrecon.main:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
test = ["pytest>=9.1.1"]
dev = [
    { include-group = "test" },
    "chromadb>=1.5.5",
    "commitizen>=4.19.0",
    "datasets>=4.8.3",
    "docker>=7.1.0",
    "huggingface-hub>=1.7.2",
    "ipywidgets>=8.1.8",
    "litellm[proxy]>=1.82.6",
    "marimo>=0.21.1",
    "ngrok>=1.7.0",
    "notebook>=7.5.5",
    "ollama>=0.6.1",
    "openai>=2.29.0",
    "podman>=5.7.0",
    "safetensors>=0.7.0",
    "tokenizers>=0.22.2",
    "tox>=4.64.7",
    "transformers>=5.3.0",
    "xai>=0.3.0",
]

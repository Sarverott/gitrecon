# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Project scripts. Included by the root Taskfile as `scripts:`.

version: '3'

tasks:
  sync:
    desc: Copy shared info from metadata.json into package.json, pyproject.toml and lockfiles
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - uv run --quiet python scripts/sync_metadata.py

  sync:check:
    desc: Fail if package.json or pyproject.toml drifted from metadata.json
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - uv run --quiet python scripts/sync_metadata.py --check

  lint:
    desc: Check the shell scripts (delegated CI steps, services) with shellcheck
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - uv run --quiet shellcheck -x scripts/delegated/workflow-gh/*.sh scripts/delegated/workflow-gh/*/*.sh services/*/*/*.sh

  merge:check:
    desc: Compare the branch with its remote version - how far apart, would a merge conflict (changes nothing)
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - python3 scripts/merge_remote.py --check

  merge:remote:
    desc: Bring the remote version of the branch in - fast-forward or merge; never pushes
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - python3 scripts/merge_remote.py {{.CLI_ARGS}}

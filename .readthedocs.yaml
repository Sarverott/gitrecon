version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"   # same as docs/.python-version

mkdocs:
  configuration: docs/mkdocs.yml
  fail_on_warning: true

# generated from docs/pyproject.toml by `task docs:lock`
python:
  install:
    - requirements: docs/requirements.txt

# gitrecon in a container; data stays on the host in ./data and ./datasets.
#
#   task docker:run -- stars sarverott        (or: docker compose run --rm gitrecon stars sarverott)
#   task docker:run -- menu                   the interactive menu (commands and status)
#   task docker:listen -- org:github          keep listening on a feed in the background
#   task docker:stop
#
# Tokens are passed from the environment; the docker:* tasks load .env and the forge .env.

name: gitrecon

x-gitrecon: &gitrecon
  build: .
  image: gitrecon:local
  user: "${UID:-1000}:${GID:-1000}"   # write ./data as the host user
  environment:
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    GH_TOKEN: ${GH_TOKEN:-}
    HF_TOKEN: ${HF_TOKEN:-}
  volumes:
    - ./data:/data
    - ./datasets:/datasets

services:
  gitrecon:
    <<: *gitrecon

  listen:
    <<: *gitrecon
    profiles: [listen]
    command: ["events", "${FEED:-public}", "--watch"]
    restart: unless-stopped

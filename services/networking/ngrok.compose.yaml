# ngrok - public access without opening ports, to traefik's `public` entrypoint
# (config/ngrok.yml). Needs NGROK_AUTHTOKEN; its inspector is ngrok.<domain> (VPN and host only).
services:
  ngrok:
    image: ngrok/ngrok:latest
    profiles: [networking, ngrok]
    restart: unless-stopped
    depends_on: [traefik]
    command: ["start", "--all", "--config", "/etc/ngrok/ngrok.yml"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    volumes:
      - ./config/ngrok.yml:/etc/ngrok/ngrok.yml:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.ngrok.rule: Host(`ngrok.${DOMAIN:-gr.rs-tech.online}`) || Host(`ngrok.localhost`)
      traefik.http.routers.ngrok.middlewares: vpn-only@file
      traefik.http.services.ngrok.loadbalancer.server.port: "4040"

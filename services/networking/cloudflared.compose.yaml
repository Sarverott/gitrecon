# Cloudflare Tunnel - public access without opening ports. Create a tunnel in Cloudflare Zero
# Trust, put its token in CLOUDFLARE_TUNNEL_TOKEN, and point each public hostname at
# http://traefik:8000 - traefik's `public` entrypoint, where only routers marked public answer.
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [networking, cloudflared]
    restart: unless-stopped
    depends_on: [traefik]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

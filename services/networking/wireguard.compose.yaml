# WireGuard - the bubble: peers join 10.13.13.0/24, reach the project network 172.30.0.0/24
# (split tunnel: only these routes) and resolve names through dnsmasq. Peer configs and QR
# codes land in the wireguard-config drive. The only port that must be reachable from outside.
services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    profiles: [networking, wireguard]
    restart: unless-stopped
    depends_on: [dnsmasq]
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
      SERVERURL: ${WIREGUARD_SERVER_URL:-auto}       # e.g. vpn.gr.rs-tech.online (DNS only, not proxied)
      SERVERPORT: ${WIREGUARD_PORT:-51820}
      PEERS: ${WIREGUARD_PEERS:-1}
      INTERNAL_SUBNET: 10.13.13.0
      PEERDNS: 172.30.0.53
      ALLOWEDIPS: 10.13.13.0/24,172.30.0.0/24
    networks:
      default:
        ipv4_address: 172.30.0.2
    ports:
      - "${WIREGUARD_BIND:-0.0.0.0}:${WIREGUARD_PORT:-51820}:51820/udp"
    volumes:
      - wireguard-config:/config

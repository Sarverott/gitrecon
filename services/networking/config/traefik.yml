# Traefik static configuration - read at start: `docker compose restart traefik` after changes.
# Routes come from labels on the services (Host(`<name>.gr.rs-tech.online`) || Host(`<name>.localhost`))
# and from config/traefik/dynamic.yml (middlewares, the dashboard).

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

accessLog:
  filePath: /var/log/traefik/access.log   # read by crowdsec

api:
  dashboard: true   # routed in dynamic.yml as traefik.<domain>, VPN and host only

entryPoints:
  web:                  # host (127.0.0.1:8880 by default) and the WireGuard network
    address: ":80"
    asDefault: true
  websecure:
    address: ":443"
    asDefault: true
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: gr.rs-tech.online
            sans: ["*.gr.rs-tech.online"]
  public:               # only tunnels (cloudflared, ngrok) reach this one; never published on the host.
    address: ":8000"    # routers must name it explicitly - nothing is public by default
  ssh:                  # gitea's SSH (a TCP route)
    address: ":2222"

providers:
  docker:
    exposedByDefault: false
    # Coolify (or anything else on the host) has traefik labels too: route only this project.
    constraints: "LabelRegex(`com.docker.compose.project`, `^gitrecon`)"
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: hostmaster@gr.rs-tech.online
      storage: /letsencrypt/acme.json
      # wildcard certificate through Cloudflare DNS: needs CF_DNS_API_TOKEN (Zone DNS edit).
      # Without it traefik logs ACME errors and serves its default certificate.
      dnsChallenge:
        provider: cloudflare

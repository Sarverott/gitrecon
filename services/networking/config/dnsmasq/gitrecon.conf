# DNS of the WireGuard bubble (peers get 172.30.0.53 as their DNS server).
#
# every name under the main domain -> traefik, the gateway of all web services
address=/gr.rs-tech.online/172.30.0.10
# plain container names (postgres, openldap, nats...) -> docker's internal DNS
server=//127.0.0.11
# everything else goes to the upstreams of the image (DNS1, DNS2)
bogus-priv

# OpenLDAP - one directory of users for the workshop, base dc=gr,dc=rs-tech,dc=online
# (from DOMAIN). No published port: reach it as `openldap` from the project network or VPN.
services:
  openldap:
    image: osixia/openldap:latest
    profiles: [networking, openldap]
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: ${LDAP_ORGANISATION:-RedScope Technologies}
      LDAP_DOMAIN: ${DOMAIN:-gr.rs-tech.online}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-change-me-ldap}
    volumes:
      - openldap-data:/var/lib/ldap
      - openldap-config:/etc/ldap/slapd.d

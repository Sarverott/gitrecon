# Networking: the gateway (traefik), the VPN bubble (wireguard + dnsmasq), public tunnels
# (cloudflared, ngrok), protection (crowdsec) and the directory of users (openldap).
# Shared setup files: config/ (traefik.yml, traefik/dynamic.yml, dnsmasq/, ngrok.yml).
include:
  - ./traefik.compose.yaml
  - ./dnsmasq.compose.yaml
  - ./wireguard.compose.yaml
  - ./cloudflared.compose.yaml
  - ./ngrok.compose.yaml
  - ./crowdsec.compose.yaml
  - ./openldap.compose.yaml

# Traefik - the gateway: every web service gets <name>.gr.rs-tech.online (and <name>.localhost
# on this host). Static setup: config/traefik.yml; middlewares and dashboard: config/traefik/.
# Host ports default to 8880/8843 because Coolify's proxy may hold 80/443 - set
# TRAEFIK_HTTP_PORT=80 TRAEFIK_HTTPS_PORT=443 where nothing else does.
services:
  traefik:
    image: traefik:v3
    profiles: [networking, traefik]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-gr.rs-tech.online}           # for config/traefik/dynamic.yml templates
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}         # wildcard certificate (letsencrypt resolver)
    networks:
      default:
        ipv4_address: 172.30.0.10                     # dnsmasq points the domain here
    ports:
      - "${TRAEFIK_BIND:-${BIND:-127.0.0.1}}:${TRAEFIK_HTTP_PORT:-8880}:80"
      - "${TRAEFIK_BIND:-${BIND:-127.0.0.1}}:${TRAEFIK_HTTPS_PORT:-8843}:443"
      - "${TRAEFIK_BIND:-${BIND:-127.0.0.1}}:${GITEA_SSH_PORT:-2222}:2222"
    volumes:
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik:/etc/traefik/dynamic:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt
      - traefik-logs:/var/log/traefik

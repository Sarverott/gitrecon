# Traefik - reverse proxy at the edge; services opt in with `traefik.enable=true` labels.
# Listens on localhost until BIND (or TRAEFIK_BIND) says otherwise.
services:
  traefik:
    image: traefik:v3
    profiles: [networking, traefik]
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
      - --api.insecure=true          # dashboard on :8080, published to localhost only
      - --accesslog=true
      - --accesslog.filepath=/var/log/traefik/access.log   # read by crowdsec
    ports:
      - "${TRAEFIK_BIND:-${BIND:-127.0.0.1}}:${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_BIND:-${BIND:-127.0.0.1}}:${TRAEFIK_HTTPS_PORT:-443}:443"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8081}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-logs:/var/log/traefik

volumes:
  traefik-logs:

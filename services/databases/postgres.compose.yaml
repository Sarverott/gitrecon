# PostgreSQL - shared by gitea, wikijs, n8n and metamcp (one database and owner each).
services:
  postgres:
    image: postgres:17-alpine
    profiles: [databases, postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gitrecon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gitrecon}
      POSTGRES_DB: ${POSTGRES_DB:-gitrecon}
      # created on first start by postgres/init-databases.sh, owner = name, password = POSTGRES_PASSWORD
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-gitea,wikijs,n8n,metamcp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      retries: 5

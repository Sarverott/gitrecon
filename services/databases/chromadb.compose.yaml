# ChromaDB - vector store for embeddings of collected data (digests, articles, docs).
services:
  chromadb:
    image: chromadb/chroma:latest
    profiles: [databases, chromadb]
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadb-data:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.chromadb.rule: Host(`chroma.${DOMAIN:-gr.rs-tech.online}`) || Host(`chroma.localhost`)
      traefik.http.routers.chromadb.middlewares: vpn-only@file
      traefik.http.services.chromadb.loadbalancer.server.port: "8000"

# Webhook watcher - runs commands on incoming HTTP hooks (GitHub, gitea, n8n); hooks are
# defined in webhook/hooks.json and reloaded on change.
services:
  webhook:
    image: almir/webhook:latest
    profiles: [runners, webhook]
    restart: unless-stopped
    command: ["-verbose", "-hooks=/etc/webhook/hooks.json", "-hotreload"]
    volumes:
      - ./webhook:/etc/webhook:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.webhook.rule: Host(`hooks.${DOMAIN:-gr.rs-tech.online}`) || Host(`hooks.localhost`)
      traefik.http.services.webhook.loadbalancer.server.port: "9000"
      traefik.http.routers.webhook-public.rule: PathPrefix(`/hooks`)
      traefik.http.routers.webhook-public.entrypoints: public
      traefik.http.routers.webhook-public.service: webhook

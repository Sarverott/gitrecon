# NATS (with JetStream) - message bus: runs, labels and feed items as events between services.
services:
  nats:
    image: nats:latest
    profiles: [runners, nats]
    restart: unless-stopped
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "${BIND:-127.0.0.1}:${NATS_PORT:-4222}:4222"
      - "${BIND:-127.0.0.1}:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data

volumes:
  nats-data:

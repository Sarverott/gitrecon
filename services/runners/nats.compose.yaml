# NATS (with JetStream) - message bus: runs, labels and feed items as events between services.
services:
  nats:
    image: nats:latest
    profiles: [runners, nats]
    restart: unless-stopped
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - nats-data:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.nats.rule: Host(`nats.${DOMAIN:-gr.rs-tech.online}`) || Host(`nats.localhost`)
      traefik.http.routers.nats.middlewares: vpn-only@file
      traefik.http.services.nats.loadbalancer.server.port: "8222"

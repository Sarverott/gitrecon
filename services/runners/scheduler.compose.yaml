# Scheduler (ofelia) - cron for containers: jobs are labels on the services they run in, e.g.
#   ofelia.job-exec.feeds.schedule: "@every 1h"
#   ofelia.job-exec.feeds.command: "gitrecon feeds --save"
services:
  scheduler:
    image: mcuadros/ofelia:latest
    profiles: [runners, scheduler]
    restart: unless-stopped
    command: ["daemon", "--docker"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

# Every persistent volume of services/, in one place: a bind mount of
#   ${REPO_DIR}/datasets/_dockdrives/<volume>
# so all service data sits in one folder - easy to check (task services:drives) and to back up.
# REPO_DIR is set by the services:* tasks and services/control.py; plain `docker compose`
# falls back to the current directory (run it from the repository root). The folders must
# exist before a service starts: `task services:up` creates the ones it needs.

volumes:
  chromadb-data:   # chromadb
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${REPO_DIR:-${PWD}}/datasets/_dockdrives/chromadb-data
  crowdsec-config:   # crowdsec
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${REPO_DIR:-${PWD}}/datasets/_dockdrives/crowdsec-config
  crowdsec-data:   # crowdsec
    driver: local

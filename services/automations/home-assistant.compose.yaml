# Home Assistant - home and device automation. Device discovery needs `network_mode: host`
# instead of the port below.
services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    profiles: [automations, home-assistant]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "${BIND:-127.0.0.1}:${HOME_ASSISTANT_PORT:-8123}:8123"
    volumes:
      - home-assistant-config:/config

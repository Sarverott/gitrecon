# Home Assistant - home and device automation. Device discovery needs `network_mode: host`
# instead of the port below.
services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    profiles: [automations, home-assistant]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - home-assistant-config:/config
    labels:
      traefik.enable: "true"
      traefik.http.routers.home-assistant.rule: Host(`home.${DOMAIN:-gr.rs-tech.online}`) || Host(`home.localhost`)
      traefik.http.services.home-assistant.loadbalancer.server.port: "8123"

# Typesense - fast search index over collected items (repositories, articles, advisories).
# No `latest` tag is published: pin a version.
services:
  typesense:
    image: typesense/typesense:29.0
    profiles: [automations, typesense]
    restart: unless-stopped
    command: ["--data-dir", "/data", "--api-key", "${TYPESENSE_API_KEY:-change-me-typesense}", "--enable-cors"]
    volumes:
      - typesense-data:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.typesense.rule: Host(`typesense.${DOMAIN:-gr.rs-tech.online}`) || Host(`typesense.localhost`)
      traefik.http.routers.typesense.middlewares: vpn-only@file
      traefik.http.services.typesense.loadbalancer.server.port: "8108"

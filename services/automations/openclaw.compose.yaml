# OpenClaw - AI agent gateway (coollabsio images), with its browser sidecar.
# Based on the project's docker-compose.yml; models through the internal ollama or API keys.
services:
  openclaw:
    image: coollabsio/openclaw:latest
    profiles: [automations, openclaw]
    restart: unless-stopped
    depends_on:
      - openclaw-browser
    environment:
      AUTH_USERNAME: ${OPENCLAW_USERNAME:-admin}
      AUTH_PASSWORD: ${OPENCLAW_PASSWORD:-}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OLLAMA_BASE_URL: ${OPENCLAW_OLLAMA_URL:-http://ollama:11434}
      XAI_API_KEY: ${XAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BROWSER_CDP_URL: http://openclaw-browser:9223
      BROWSER_DEFAULT_PROFILE: openclaw
    volumes:
      - openclaw-data:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.openclaw.rule: Host(`claw.${DOMAIN:-gr.rs-tech.online}`) || Host(`claw.localhost`)
      traefik.http.services.openclaw.loadbalancer.server.port: "8080"

  openclaw-browser:
    image: coollabsio/openclaw-browser:latest
    profiles: [automations, openclaw]
    restart: unless-stopped
    shm_size: 2g
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
      CHROME_CLI: --remote-debugging-port=9222
    volumes:
      - openclaw-browser-data:/config

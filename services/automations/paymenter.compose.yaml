# Paymenter - webshop and billing for hosted services. Uses mariadb and redis.
# Based on the project's docker-compose.example.yml.
services:
  paymenter:
    image: ghcr.io/paymenter/paymenter:latest
    profiles: [automations, paymenter]
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: production
      DB_CONNECTION: mariadb
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: ${MARIADB_DATABASE:-paymenter}
      DB_USERNAME: ${MARIADB_USER:-paymenter}
      DB_PASSWORD: ${MARIADB_PASSWORD:-gitrecon}
      CACHE_STORE: redis
      REDIS_HOST: redis
      PAYMENTER_SKIP_DEFAULT: "false"
    volumes:
      - paymenter-app:/app
      - paymenter-var:/app/var
    labels:
      traefik.enable: "true"
      traefik.http.routers.paymenter.rule: Host(`shop.${DOMAIN:-gr.rs-tech.online}`) || Host(`shop.localhost`)
      traefik.http.services.paymenter.loadbalancer.server.port: "80"

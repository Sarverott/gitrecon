# ntfy - push notifications: alerts when a label fires or a run finishes.
services:
  ntfy:
    image: binwiederhier/ntfy:latest
    profiles: [automations, ntfy]
    restart: unless-stopped
    command: ["serve"]
    environment:
      NTFY_BASE_URL: https://ntfy.${DOMAIN:-gr.rs-tech.online}
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
    volumes:
      - ntfy-cache:/var/cache/ntfy
    labels:
      traefik.enable: "true"
      traefik.http.routers.ntfy.rule: Host(`ntfy.${DOMAIN:-gr.rs-tech.online}`) || Host(`ntfy.localhost`)
      traefik.http.services.ntfy.loadbalancer.server.port: "80"

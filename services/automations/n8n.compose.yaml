# n8n - workflow automation: glue between gitrecon runs, feeds, notifications and the rest.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    profiles: [automations, n8n]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-gitrecon}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-n8n-key}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}   # plain http on localhost
      GENERIC_TIMEZONE: ${TZ:-Etc/UTC}
      N8N_HOST: n8n.${DOMAIN:-gr.rs-tech.online}
      WEBHOOK_URL: https://n8n.${DOMAIN:-gr.rs-tech.online}/
    volumes:
      - n8n-data:/home/node/.n8n
    labels:
      traefik.enable: "true"
      traefik.http.routers.n8n.rule: Host(`n8n.${DOMAIN:-gr.rs-tech.online}`) || Host(`n8n.localhost`)
      traefik.http.services.n8n.loadbalancer.server.port: "5678"

# Transmission - BitTorrent client for store areas (datasets and archives shared as torrents).
services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    profiles: [automations, transmission]
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "${TRANSMISSION_PEER_BIND:-0.0.0.0}:51413:51413"
      - "${TRANSMISSION_PEER_BIND:-0.0.0.0}:51413:51413/udp"
    volumes:
      - transmission-config:/config
      - transmission-downloads:/downloads
    labels:
      traefik.enable: "true"
      traefik.http.routers.transmission.rule: Host(`torrent.${DOMAIN:-gr.rs-tech.online}`) || Host(`torrent.localhost`)
      traefik.http.routers.transmission.middlewares: vpn-only@file
      traefik.http.services.transmission.loadbalancer.server.port: "9091"

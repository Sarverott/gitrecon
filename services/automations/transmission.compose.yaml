# Transmission - BitTorrent client for store areas (datasets and archives shared as torrents).
services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    profiles: [automations, transmission]
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "${BIND:-127.0.0.1}:${TRANSMISSION_PORT:-9091}:9091"
      - "${TRANSMISSION_PEER_BIND:-0.0.0.0}:51413:51413"
      - "${TRANSMISSION_PEER_BIND:-0.0.0.0}:51413:51413/udp"
    volumes:
      - transmission-config:/config
      - transmission-downloads:/downloads

# SearXNG - private metasearch, a web search source for recon without trackers.
services:
  searxng:
    image: searxng/searxng:latest
    profiles: [internals, searxng]
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: https://search.${DOMAIN:-gr.rs-tech.online}/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-searxng-secret}
    volumes:
      - searxng-config:/etc/searxng
    labels:
      traefik.enable: "true"
      traefik.http.routers.searxng.rule: Host(`search.${DOMAIN:-gr.rs-tech.online}`) || Host(`search.localhost`)
      traefik.http.services.searxng.loadbalancer.server.port: "8080"

# SearXNG - private metasearch, a web search source for recon without trackers.
services:
  searxng:
    image: searxng/searxng:latest
    profiles: [internals, searxng]
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8888/}
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-searxng-secret}
    ports:
      - "${BIND:-127.0.0.1}:${SEARXNG_PORT:-8888}:8080"
    volumes:
      - searxng-config:/etc/searxng

# Docker registry - images built in the workshop (gitrecon, runners) without a public hub.
services:
  registry:
    image: registry:2
    profiles: [internals, registry]
    restart: unless-stopped
    volumes:
      - registry-data:/var/lib/registry
    labels:
      traefik.enable: "true"
      traefik.http.routers.registry.rule: Host(`registry.${DOMAIN:-gr.rs-tech.online}`) || Host(`registry.localhost`)
      traefik.http.routers.registry.middlewares: vpn-only@file
      traefik.http.services.registry.loadbalancer.server.port: "5000"

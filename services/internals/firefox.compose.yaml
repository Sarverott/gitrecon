# Firefox in a container - a disposable browser for visiting what recon finds (web UI on 5800).
services:
  firefox:
    image: jlesage/firefox:latest
    profiles: [internals, firefox]
    restart: unless-stopped
    shm_size: 2g
    environment:
      USER_ID: "1000"
      GROUP_ID: "1000"
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - firefox-config:/config
    labels:
      traefik.enable: "true"
      traefik.http.routers.firefox.rule: Host(`firefox.${DOMAIN:-gr.rs-tech.online}`) || Host(`firefox.localhost`)
      traefik.http.routers.firefox.middlewares: vpn-only@file
      traefik.http.services.firefox.loadbalancer.server.port: "5800"

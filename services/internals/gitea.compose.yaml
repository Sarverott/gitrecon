# Gitea - self-hosted git server for the private scope repositories (BOS remotes policy).
services:
  gitea:
    image: gitea/gitea:latest
    profiles: [internals, gitea]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD:-gitrecon}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-http://localhost:3000/}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__actions__ENABLED: "true"
    ports:
      - "${BIND:-127.0.0.1}:${GITEA_PORT:-3000}:3000"
      - "${BIND:-127.0.0.1}:${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - gitea-data:/data

volumes:
  gitea-data:

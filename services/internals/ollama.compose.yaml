# Ollama - local language models (gitrecon digest, openclaw). Host port 11435, so a host
# ollama on 11434 can keep running.
services:
  ollama:
    image: ollama/ollama:latest
    profiles: [internals, ollama]
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    # GPU (needs the NVIDIA container toolkit on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    labels:
      traefik.enable: "true"
      traefik.http.routers.ollama.rule: Host(`ollama.${DOMAIN:-gr.rs-tech.online}`) || Host(`ollama.localhost`)
      traefik.http.routers.ollama.middlewares: vpn-only@file
      traefik.http.services.ollama.loadbalancer.server.port: "11434"

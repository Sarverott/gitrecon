# How frameworks and tools are recognised in a repository.
#
# manifests: dependency files - which ecosystem they belong to and how they are read
#            (readers live in gitrecon.code.frameworks)
# packages:  per ecosystem, package name -> what its presence means
# files:     marker files or folders (glob, relative to the repository root) -> tool

manifests:
  package.json:      {ecosystem: npm, reader: json_keys, keys: [dependencies, devDependencies, peerDependencies]}
  composer.json:     {ecosystem: composer, reader: json_keys, keys: [require, require-dev]}
  pyproject.toml:    {ecosystem: pypi, reader: pyproject}
  requirements*.txt: {ecosystem: pypi, reader: requirements}
  Pipfile:           {ecosystem: pypi, reader: toml_keys, keys: [packages, dev-packages]}
  Cargo.toml:        {ecosystem: cargo, reader: toml_keys, keys: [dependencies, dev-dependencies]}
  go.mod:            {ecosystem: go, reader: gomod}
  Gemfile:           {ecosystem: gems, reader: gemfile}


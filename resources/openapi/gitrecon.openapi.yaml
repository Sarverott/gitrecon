openapi: 3.1.0
info:
  title: gitrecon
  version: 0.8.0
  description: 'Exploring, mapping and labeling GitHub activity of users, organizations, repositories and projects


    Generated from the command-line parser and the Taskfile (`task openapi`); do not edit. A contract: no server
    answers it yet.'
tags:
- name: collect
  description: collect - bring data in
- name: analyze
  description: analyze - read and draw what was collected
- name: atlas
  description: atlas - the map dataset
- name: content
  description: content - text, commits, digests
- name: 'task: project'
- name: 'task: commit'
- name: 'task: docker'
- name: 'task: docs'
- name: 'task: examples'
- name: 'task: gh'
- name: 'task: hooks'
- name: 'task: map'
- name: 'task: merge'
- name: 'task: scripts'
paths:
  /commands/events:
    post:
      operationId: command_events
      tags:
      - collect
      summary: poll an Events API feed into the raw buffer
      x-cli: gitrecon events [feed]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                feed:
                  type: string
                  description: public | user:X | org:X | repo:owner/name
                  default: public
                watch:
                  type: boolean
                  description: keep listening
                output:
                  type: string
                  enum:
                  - text
                  - json
                  - urls
                  default: text
                  description: 'text for people; json / urls: data only'
              additionalProperties: false
      responses:
        '200':
          description: the command's output
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '400':
          description: the command refused the arguments or failed
  /commands/gists:
    post:
      operationId: command_gists
      tags:
      - collect
      summary: fetch public (or one user's) gists into the raw buffer
      x-cli: gitrecon gists
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                since:
                  type: string
                  description: ISO timestamp
                pages:
                  type: integer
                  default: 3
                output:
                  type: string
                  enum:
                  - text
                  - json
                  - urls
                  default: text
                  description: 'text for people; json / urls: data only'
              additionalProperties: false
      responses:
        '200':
          description: the command's output
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '400':
          description: the command refused the arguments or failed
  /commands/gist-catalog:
    post:
      operationId: command_gist_catalog
      tags:
      - collect
      summary: 'every gist of a user: files, stars, comments, forks, commits, size'
      x-cli: gitrecon gist-catalog <user>
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                  description: GitHub nickname, e.g. sarverott
                privacy:
                  type: string
                  enum:
                  - public
                  - all
                  - secret
                  description: all/secret need that user's own token
                  default: public
                no_commits:
                  type: boolean
                  description: skip counting commits (one request per gist)
                output:
                  type: string
                  enum:
                  - text
                  - json
                  - urls
                  default: text
                  description: 'text for people; json / urls: data only'
              additionalProperties: false
              required:
              - user
      responses:
        '200':
          description: the command's output
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '400':
          description: the command refused the arguments or failed
  /commands/gist-clone:
    post:
      operationId: command_gist_clone
      tags:
      - collect
      summary: clone a user's gists into PATH/<gistID>, as they are
      x-cli: gitrecon gist-clone <user> [path]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                  description: GitHub nickname, e.g. sarverott
                path:
                  type: string
                  description: 'where the clones go, PATH/<gistID> (created when missing); default: <forge>/<USER>/my-gists,
                    i.e. ~/__WORKSHOP/forge/<USER>/my-gists'
                privacy:
                  type: string
                  enum:
                  - public
                  - all
                  - secret
                  default: public
                limit:
                  type: integer
                  description: only the first N (oldest first)
                update:
                  type: boolean
                  description: fast-forward clones that exist already
                dry_run:
                  type: boolean
                  description: list what would be cloned and its size, clone nothing
                output:
                  type: string
                  enum:
                  - text
                  - json
                  - urls
                  default: text
                  description: 'text for people; json / urls: data only'
              additionalProperties: false
              required:
              - user
      responses:
        '200':
          description: the command's output
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '400':
          description: the command refused the arguments or failed
  /commands/repos:
    post:
      operationId: command_repos
      tags:
      - collect
      summary: repositories a user owns
      x-cli: gitrecon repos <user>
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                  description: GitHub nickname, e.g. sarverott
                privacy:
                  type: string
                  enum:
                  - public
                  - all
                  description: 'all: private too (own token)'
                  default: public
                no_forks:
                  type: boolean
                  description: leave forks out
                no_archived:
                  type: boolean
                  description: leave archived repositories out
                output:
                  type: string
                  enum:
                  - text
                  - json
                  - urls
                  default: text
                  description: 'text for people; json / urls: data only'
              additionalProperties: false
              required:
              - user
      responses:
        '200':
          description: the command's output
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '400':
          description: the command refused the arguments or failed
  /commands/orgs:
    post:
      operationId: command_orgs
      tags:
      - collect
      summary: organizations a user belongs to (all of them with the user's own token)
      x-cli: gitrecon orgs <user>
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                  description: GitHub nickname, e.g. sarverott
                output:
                  type: string
                  enum:
                  - text
                  - json
                  - urls
                  default: text
                  description: 'text for people; json / urls: data only'
              additionalProperties: false
              required:
              - user
      responses:
        '200':
          description: the command's output
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '400':
          description: the command refused the arguments or failed
  /commands/org-repos:
    post:
      operationId: command_org_repos
      tags:
      - collect
      summary: repositories of an organization
      x-cli: gitrecon org-repos <org>
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                org:
                  type: string
                  description: organization login, e.g. The-Apokryf
                no_forks:
                  type: boolean
                  description: leave forks out
                no_archived:
                  type: boolean
                  description: leave archived repositories out
                output:
                  type: string
                  enum:
                  - text
                  - json
                  - urls
                  default: text
                  description: 'text for people; json / urls: data only'
              additionalProperties: false
              required:
              - org
      responses:
        '200':
          description: the command's output
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '400':
          description: the command refused the arguments or failed
  /commands/repo-clone:
    post:
      operationId: command_repo_clone
      tags:
      - collect
      summary: clone the repositories a user owns into PATH/<name>
      x-cli: gitrecon repo-clone <user> [path]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                  description: GitHub nickname, e.g. sarverott
                path:
                  type: string
                  description: 'where the clones go, PATH/<name> (created when missing); default: <forge>/<USER
                    or ORG>/, i.e. ~/__WORKSHOP/forge/<name>/'
                limit:
                  type: integer
                  description: only the first N (oldest first)
                depth:
                  type: integer
                  description: shallow clones, e.g. 1 = newest commit only (much smaller)
                update:
                  type: boolean
                  description: fast-forward clones that exist already
                dry_run:
                  type: boolean
                  description: list what would be cloned and its size, clone nothing
                no_analysis:
                  type: boolean
                  description: 'only clone: by default every clone is analysed (languages, frameworks) and the result
                    kept in the raw buffer and the map dataset'
                map_priv_repos:
                  type: boolean
                  description: write the analysis of private repositories to the map dataset too
                privacy:
                  type: string
                  enum:
                  - public
                  - all
                  description: 'all: private too (own token)'
                  default: public
                no_forks:
                  type: boolean
                  description: leave forks out
                no_archived:
                  type: boolean
                  description: leave archived repositories out
                output:
                  type: string
                  enum:
                  - text
                  - json
                  - urls
                  default: text
                  description: 'text for people; json / urls: data only'
              additionalProperties: false
              required:
              - user
      responses:
        '200':
          description: the command's output
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '400':
          description: the command refused the arguments or failed
  /commands/org-clone:
    post:
      operationId: command_org_clone
      tags:
      - collect
      summary: clone the repositories of an organization into PATH/<name>
      x-cli: gitrecon org-clone <org> [path]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                org:
                  type: string
                  description: organization login, e.g. The-Apokryf
                path:
                  type: string
                  description: 'where the clones go, PATH/<name> (created when missing); default: <forge>/<USER
                    or ORG>/, i.e. ~/__WORKSHOP/forge/<name>/'
                limit:
                  type: integer
                  description: only the first N (oldest first)
                depth:
                  type: integer
                  description: shallow clones, e.g. 1 = newest commit only (much smaller)
                update:
                  type: boolean
                  description: fast-forward clones that exist already
                dry_run:
                  type: boolean
                  description: list what would be cloned and its size, clone nothing
                no_analysis:
                  type: boolean
                  description: 'only clone: by default every clone is analysed (languages, frameworks) and the result
                    kept in the raw buffer and the map dataset'
                map_priv_repos:
                  type: boolean
                  description: write the analysis of private repositories to the map dataset too
                no_forks:
                  type: boolean
                  description: leave forks out
                no_archived:
                  type: boolean
                  description: leave archived repositories out
                output:
                  type: string
                  enum:
                  - text
                  - json
                  - urls
                  default: text
                  description: 'text for people; json / urls: data only'
              additionalProperties: false
              required:
              - org
      responses:
        '200':
          description: the command's output
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '400':
          description: the command refused the arguments or failed
  /commands/stars:
    post:
      operationId: command_stars
      tags:
      - collect
      summary: list repositories starred by a user
      x-cli: gitrecon stars <user>
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                  description: GitHub nickname, e.g. sarverott
                save:
                  type: boolean
                  description: also store them in the raw buffer
                output:
                  type: string
                  enum:
                  - text
                  - json
                  - urls
                  default: text
                  description: 'text for people; json / urls: data only'
              additionalProperties: false
              required:
              - user
      responses:
        '200':
          description: the command's output
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '400':
          description: the command refused the arguments or failed
  /commands/archive:
    post:
      operationId: command_archive
      tags:
      - collect
      summary: download GH Archive hours into the raw buffer
      x-cli: gitrecon archive <start> [end]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                start:
                  type: string
                  description: YYYY-MM-DD-H (UTC)
                end:
                  type: string
                  description: YYYY-MM-DD-H, inclusive
                output:
                  type: string
                  enum:
                  - text
                  - json
                  - urls
                  default: text
                  description: 'text for people; json / urls: data only'
              additionalProperties: false
              required:
              - start
      responses:
        '200':
          description: the command's output
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '400':
          description: the command refused the arguments or failed
  /commands/links:
    post:
      operationId: command_links
      tags:
      - collect
      summary: harvest data source links from cloned gists (or any notes)
      x-cli: gitrecon links [root]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                root:
                  type: string
                  description: 'directory holding gist clones (default: ..)'
                  default: ..
                all:
                  type: boolean
                  description: scan every note file under root, not only gists
                kind:
                  type: array
                  items:
                    type: string
                  description: keep only this kind (repeatable), e.g. feed
                save:
                  type: boolean
                  description: write the catalog to data/catalog/links.jsonl
                output:
                  type: string
                  enum:
                  - text
                  - json
                  - urls
                  default: text
                  description: 'text for people; json / urls: data only'
              additionalProperties: false
      responses:
        '200':
          description: the command's output
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '400':
          description: the command refused the arguments or failed
  /commands/feeds:
    post:
      operationId: command_feeds
      tags:
      - collect
      summary: 'read RSS/Atom feeds (default: feeds in the link catalog)'
      x-cli: gitrecon feeds [url]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: array
                  items:
                    type: string
                save:
                  type: boolean
                  description: store new items in the raw buffer
                verbose_items:
                  type: boolean
                  description: list new items
                output:
                  type: string
                  enum:
                  - text
                  - json
                  - urls
                  default: text
                  description: 'text for people; json / urls: data only'
              additionalProperties: false
      responses:
        '200':
          description: the command's output
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '400':
          description: the command refused the arguments or failed
  /commands/rfc:
    post:
      operationId: command_rfc
      tags:
      - collect
      summary: 'RFC Editor index: list, search, save'
      x-cli: gitrecon rfc
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                search:
                  type: array
                  items:
                    type: string
                  description: words that must all appear in the entry
                number:
                  type: array
                  items:
                    type: string
                  description: show one RFC in full (repeatable)
                limit:
                  type: integer
                  description: newest N when not searching
                  default: 20
                save:
                  type: boolean
                  description: write data/catalog/rfc-index.jsonl
                output:
                  type: string
                  enum:
                  - text
                  - json
                  - urls
                  default: text
                  description: 'text for people; json / urls: data only'
              additionalProperties: false
      responses:
        '200':
          description: the command's output
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '400':
          description: the command refused the arguments or failed
  /commands/blog:
    post:
      operationId: command_blog
      tags:
      - collect
      summary: 'harvest articles of a blog as markdown (default: Apokryf)'
      x-cli: gitrecon blog [url]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  default: https://blog.apokryf.pl
                limit:
                  type: integer
                dump:
                  type: boolean
                  description: print articles in the notebook's dump format
                save:
                  type: boolean
                  description: store articles in the raw buffer
                output:
                  type: string
                  enum:
                  - text
                  - json
                  - urls
                  default: text
                  description: 'text for people; json / urls: data only'
              additionalProperties: false
      responses:
        '200':
          description: the command's output
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '400':
          description: the command refused the arguments or failed
  /commands/map:
    post:
      operationId: command_map
      tags:
      - analyze
      summary: build the activity graph from the raw buffer
      x-cli: gitrecon map
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  description: 'events | gists | gharchive (default: all)'
                node:
                  type: string
                  description: show neighbors of a key, e.g. user:octocat
                full:
                  type: boolean
                  description: 'every edge (with --json: all nodes and edges)'
                output:
                  type: string
                  enum:
                  - text
                  - json
                  - urls
                  default: text
                  description: 'text for people; json / urls: data only'
              additionalProperties: false
      responses:
        '200':
          description: the command's output
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '400':
          description: the command refused the arguments or failed
  /commands/network:
    post:
      operationId: command_network
      tags:
      - analyze
      summary: 'relations around a user: repositories, organizations, where forks come from'
      x-cli: gitrecon network <user>
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                  description: GitHub nickname, e.g. sarverott
                format:
                  type: string
                  enum:
                  - summary
                  - mermaid
                  - mindmap
                  - dot
                  description: summary (default), a Mermaid flowchart, a Mermaid mindmap of the owner, or Graphviz
                    DOT
                  default: summary
                max_repos:
                  type: integer
                  description: 'mindmap: repositories shown per owner (most starred)'
                  default: 10
                level:
                  type: string
                  enum:
                  - owners
                  - repos
                  description: 'diagram zoom: owners (who forks from whom) or repositories grouped by owner'
                  default: owners
                min_forks:
                  type: integer
                  description: 'owners level: draw fork flows of at least N'
                  default: 1
                max_nodes:
                  type: integer
                  description: 'repos level: most connected N repositories'
                  default: 150
                forks_only:
                  type: boolean
                  description: 'repos level: only repositories in a fork relation'
                no_orgs:
                  type: boolean
                  description: only the user's own repositories
                privacy:
                  type: string
                  enum:
                  - public
                  - all
                  description: 'all: private too (own token)'
                  default: public
                limit:
                  type: integer
                  description: 'summary: how many fork flows to list'
                  default: 25
                save:
                  type: boolean
                  description: write the diagram to data/networks/<user>-<level>.md
                verbose_progress:
                  type: boolean
                  description: say what is being collected
                output:
                  type: string
                  enum:
                  - text
                  - json
                  - urls
                  default: text
                  description: 'text for people; json / urls: data only'
              additionalProperties: false
              required:
              - user
      responses:
        '200':
          description: the command's output
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '400':
          description: the command refused the arguments or failed
  /commands/analyze:
    post:
      operationId: command_analyze
      tags:
      - analyze
      summary: 'what cloned repositories are made of: languages, structure, frameworks'
      x-cli: gitrecon analyze [path]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: array
                  items:
                    type: string
                  description: 'repositories, or folders of repositories such as ~/__WORKSHOP/forge/rattish (default:
                    .)'
                  default:
                  - .
                limit:
                  type: integer
                  description: 'languages listed per repository (pie: slices)'
                  default: 8
                format:
                  type: string
                  enum:
                  - summary
                  - pie
                  description: summary (default) or a Mermaid pie of the languages, all given repositories together
                  default: summary
                deep:
                  type: boolean
                  description: 'CaptorLex step 1: also functions, methods, classes per language (tree-sitter; code
                    extra)'
                map_priv_repos:
                  type: boolean
                  description: write private repositories to the map dataset too (by default only public ones; the
                    map gets published)
                no_save:
                  type: boolean
                  description: 'only print: by default results go to the raw buffer and the map dataset'
                output:
                  type: string
                  enum:
                  - text
                  - json
                  - urls
                  default: text
                  description: 'text for people; json / urls: data only'
              additionalProperties: false
      responses:
        '200':
          description: the command's output
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '400':
          description: the command refused the arguments or failed
  /commands/commits:
    post:
      operationId: command_commits
      tags:
      - analyze
      summary: 'a cloned repository''s commit messages read as records: types, scopes, labels'
      x-cli: gitrecon commits [path]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: 'the repository (default: the current folder)'
                  default: .
                max_commits:
                  type: integer
                  description: 'only the newest N (default: all)'
                list:
                  type: boolean
                  description: also every commit with its form and type
                output:
                  type: string
                  enum:
                  - text
                  - json
                  default: text
                  description: 'text for people; json / urls: data only'
              additionalProperties: false
      responses:
        '200':
          description: the command's output
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '400':
          description: the command refused the arguments or failed
  /commands/imports:
    post:
      operationId: command_imports
      tags:
      - analyze
      summary: which file uses which inside a cloned repository (CaptorLex step 2)
      x-cli: gitrecon imports [path]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: 'the repository (default: the current folder)'
                  default: .
                format:
                  type: string
                  enum:
                  - summary
                  - mermaid
                  default: summary
                level:
                  type: string
                  enum:
                  - folder
                  - file
                  description: 'mermaid: folders (default) or files'
                  default: folder
                depth:
                  type: integer
                  description: 'folder level: how many path parts make a folder'
                  default: 3
                max_nodes:
                  type: integer
                  description: 'file level: draw the N most connected files'
                  default: 80
                limit:
                  type: integer
                  description: 'summary: rows per list'
                  default: 8
                save:
                  type: boolean
                  description: write the diagram to data/imports/<repository>-<level>.md
                output:
                  type: string
                  enum:
                  - text
                  - json
                  default: text
                  description: 'text for people; json / urls: data only'
              additionalProperties: false
      responses:
        '200':
          description: the command's output
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '400':
          description: the command refused the arguments or failed
  /commands/contributors:
    post:
      operationId: command_contributors
      tags:
      - analyze

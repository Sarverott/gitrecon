# yaml-language-server: $schema=https://taskfile.dev/schema.json
# https://taskfile.dev

version: '3'

includes:
  scripts: ./scripts/Taskfile.yml
  gh: ./.github/Taskfile.yml
  hooks: ./.husky/Taskfile.yml
  examples: ./examples/Taskfile.yml
  docs: ./docs/Taskfile.yml

tasks:
  default:
    cmds:
      - task: help
    silent: true

  menu:
    desc: Interactive menu - commands, tasks, examples, manuals, status (arrows + enter)
    cmds:
      - uv run --quiet gitrecon menu
    interactive: true

  help:
    desc: List every task, and where to read more
    cmds:
      - task --list
      - echo ""
      - 'echo "Menu:    task menu (or just: uv run gitrecon) - pick anything with the arrows"'
      - echo ""
      - 'echo "Manuals: task manuals lists the documentation in docs/ (guides, glossary);"'
      - 'echo "         task manuals -- <page> reads one, e.g. task manuals -- user-namespace"'
    silent: true

  manuals:
    desc: 'Read the markdown docs in docs/ in the terminal, e.g. task manuals -- map-dataset'
    cmds:
      - uv run --quiet python scripts/manuals.py {{.CLI_ARGS}}
    interactive: true

  install:
    desc: Install uv dependencies and the git hooks (husky)
    cmds:
      - uv sync --all-extras
      - npm install

  test:
    desc: Run the offline test suite and the metadata sync check
    cmds:
      - uv run pytest {{.CLI_ARGS}}
      - task: scripts:sync:check

  lint:
    desc: Lint workflows and delegated scripts
    cmds:
      - task: gh:lint
      - task: scripts:lint

  sync:
    desc: Copy shared info from metadata.json into package.json, pyproject.toml and lockfiles
    cmds:
      - task: scripts:sync

  save:
    desc: Commit everything that changed as one commit - the message is written for you (hooks run, autopush applies)
    cmds:
      - uv run --quiet gitrecon save .

  openapi:
    desc: Regenerate resources/openapi/gitrecon.openapi.yaml from the commands and this Taskfile
    cmds:
      - mkdir -p resources/openapi
      - uv run --quiet gitrecon openapi > resources/openapi/gitrecon.openapi.yaml

  scrapnote:
    desc: Start a scrapnote in docs/devlog/ named by the current moment (UNIXUSAT, milliseconds)
    cmds:
      - uv run --quiet python scripts/scrapnote.py {{.CLI_ARGS}}

  merge:check:
    desc: Compare the branch with its remote version - how far apart, would a merge conflict (changes nothing)
    cmds:
      - task: scripts:merge:check

  merge:remote:
    desc: Bring the remote version of the branch in (after "push rejected") - fast-forward or merge; never pushes
    cmds:
      - task: scripts:merge:remote

  commit:
    desc: Commit with commitizen (conventional message prompt); routines from .husky/bos.config.json apply
    interactive: true
    cmds:
      - task: hooks:routine:add-all
      - uv run cz commit

  bump:
    desc: Bump version, changelog and tag (CI does this on every merge into master, don't run it by hand there)
    cmds:
      - uv run cz bump {{.CLI_ARGS}}

  recon:
    desc: Run the gitrecon CLI, e.g. `task recon -- stars sarverott`
    cmds:
      - uv run gitrecon {{.CLI_ARGS}}

  listen:
    desc: Keep listening on a feed, e.g. `task listen -- org:github`
    cmds:
      - uv run gitrecon events {{.CLI_ARGS}} --watch

  map:refresh:
    desc: Pull the map dataset, harvest gist links and write findings into it (no push)
    cmds:
      - uv run gitrecon atlas pull
      - uv run gitrecon links --save
      - uv run gitrecon atlas update

  map:push:
    desc: 'Push the map to Hugging Face, e.g. task map:push -- -m "dnstrees from gists"'
    cmds:
      - uv run gitrecon atlas push {{.CLI_ARGS}}

  docker:build:
    desc: Build the gitrecon image (gitrecon:local)
    cmds:
      - docker compose build

  docker:run:
    desc: 'Run the CLI in a container, e.g. task docker:run -- stars sarverott'
    dotenv: ['.env', '../../.env']   # TODO: forge .env is a temporary home for tokens
    env:
      UID: { sh: id -u }
      GID: { sh: id -g }
    cmds:
      - mkdir -p data datasets
      - docker compose run --rm gitrecon {{.CLI_ARGS}}
    interactive: true

  docker:listen:
    desc: 'Listen on a feed in the background, e.g. task docker:listen -- org:github (default: public)'
    dotenv: ['.env', '../../.env']
    env:
      UID: { sh: id -u }
      GID: { sh: id -g }
      FEED: '{{.CLI_ARGS | default "public"}}'
    cmds:
      - mkdir -p data datasets
      - docker compose --profile listen up -d --build listen
      - docker compose --profile listen logs --tail 5 listen

  docker:stop:
    desc: Stop the background listener
    cmds:
      - docker compose --profile listen down

